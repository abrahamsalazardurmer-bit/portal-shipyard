<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Monitoreo de Maniobras | CITITUG</title>

<!-- Leaflet (mapa) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  /* ========= PALETA CITITUG ========= */
  :root{
    --azul-osc:#0A2A4A; --azul:#0F3A6B; --azul-claro:#1E5AA8;
    --naranja:#FF8C00; --gris:#F4F7FB; --borde:#e7eef7;
    --glass:rgba(255,255,255,.85); --shadow:0 10px 30px rgba(7,26,46,.12);
    --radius:18px;
  }

  /* ========= RESETEOS BÁSICOS ========= */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--gris); color:#10212b; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }

  /* ========= HEADER ========= */
  .app-header{
    height:64px; background:linear-gradient(90deg,var(--azul-osc),var(--azul));
    color:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; box-shadow:var(--shadow); position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px}
  .brand .logo{
    width:36px; height:36px; border-radius:10px; background:var(--naranja);
    display:grid; place-items:center; font-weight:800; color:#0A2A4A;
  }
  .brand h1{font-size:16px; line-height:1.1; margin:0}
  .actions{display:flex; align-items:center; gap:8px}
  .btn{
    background:#ffffff20; border:1px solid #ffffff33; color:#fff;
    padding:8px 12px; border-radius:12px; cursor:pointer;
  }
  .btn:hover{background:#ffffff30}

  /* ========= LAYOUT PRINCIPAL ========= */
  .layout{
    display:grid; grid-template-columns:320px 1fr; gap:16px;
    padding:16px; height:calc(100dvh - 64px);
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr; grid-template-rows:420px 1fr; height:auto}
  }

  /* ========= SIDEBAR ========= */
  .sidebar{
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
    padding:12px; display:flex; flex-direction:column; min-height:0;
  }
  .sidebar .tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
  .sidebar .tools input{
    flex:1 1 100%; padding:10px 12px; border:1px solid var(--borde); border-radius:12px;
  }
  .chip{
    padding:6px 10px; border:1px solid var(--borde); border-radius:999px; background:#fff; cursor:pointer;
    font-size:12px;
  }
  .chip.active{border-color:var(--azul-claro); color:var(--azul-claro); background:#f0f6ff}

  .cards{overflow:auto; padding-right:4px}
  .card{
    background:var(--gris); border-radius:16px; padding:12px; margin:10px 2px;
    border:1px solid var(--borde); box-shadow:0 2px 10px rgba(0,0,0,.03);
    display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center;
    transition:transform .08s ease;
  }
  .card:hover{transform:translateY(-1px)}
  .title{font-weight:700}
  .coords{font-size:12px; color:#3d5566}
  .right{display:flex; align-items:center; gap:6px}
  .badge{
    font-size:11px; padding:4px 8px; border-radius:999px; font-weight:600;
  }
  .b-green{background:#e9f7ef; color:#2e7d32}
  .b-yellow{background:#fff8e1; color:#8d6e00}
  .b-red{background:#ffebee; color:#c62828}
  .go-btn{border:none; background:var(--azul-claro); color:#fff; padding:6px 8px; border-radius:10px; cursor:pointer}
  .go-btn:hover{filter:brightness(1.05)}

  /* ========= MAPA ========= */
  .map-wrap{
    position:relative; border-radius:var(--radius); overflow:hidden;
    box-shadow:var(--shadow); background:#cfe8ff; min-height:400px;
  }
  #map{height:100%; width:100%}
  .map-topbar{
    position:absolute; top:12px; left:12px; right:12px; z-index:1000;
    display:flex; justify-content:space-between; gap:8px;
  }
  .glass{
    background:var(--glass); backdrop-filter:blur(8px);
    border:1px solid #ffffff80; border-radius:14px; padding:8px 10px; display:flex; gap:8px; align-items:center;
  }
  .legend-dot{width:10px; height:10px; border-radius:50%}
  .g{background:#2e7d32}.y{background:#fbc02d}.r{background:#c62828}
  .footer{
    padding:8px 16px; color:#476278; font-size:12px; display:flex; justify-content:space-between;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">⛴</div>
    <div>
      <h1>Monitoreo de Maniobras · CITITUG</h1>
      <div style="opacity:.8;font-size:12px">Esmeraldas · Vista en tiempo (casi) real</div>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="refreshBtn">Refrescar ubicaciones</button>
    <div id="clock" aria-label="Reloj"></div>
  </div>
</header>

<main class="layout">
  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar">
    <div class="tools">
      <input id="searchBox" placeholder="Buscar remolcador..." />
      <button class="chip active" data-filter="ALL">Todos</button>
      <button class="chip" data-filter="MANIOBRA">En maniobra</button>
      <button class="chip" data-filter="TRANSITO">En tránsito</button>
      <button class="chip" data-filter="MANTO">Mantenimiento</button>
    </div>
    <div class="cards" id="cards"></div>
  </aside>

  <!-- ========== MAPA ========== -->
  <section class="map-wrap">
    <div class="map-topbar">
      <div class="glass">
        <strong>Estado:</strong>
        <div class="legend-dot g" title="En maniobra"></div> <span style="font-size:12px">Maniobra</span>
        <div class="legend-dot y" title="En tránsito" style="margin-left:8px"></div> <span style="font-size:12px">Tránsito</span>
        <div class="legend-dot r" title="Mantenimiento" style="margin-left:8px"></div> <span style="font-size:12px">Mantenimiento</span>
      </div>
      <div class="glass">Última actualización: <span id="lastUpdate">—</span></div>
    </div>
    <div id="map"></div>
  </section>
</main>

<div class="footer">
  <div>Fuente: SUINBA / AIS (demo)</div>
  <div>© CITITUG · PORTWISE</div>
</div>

<script>
  // ================== DEMO DATA (puedes conectar API luego) ==================
  const vessels = [
    {
      id:"ESP1", name:"ESPERANZA I", lat:1.01889, lng:-79.67445,
      status:"MANIOBRA", speed:6.3, destino:"Boya 8A"
    },
    {
      id:"STF", name:"SANTA FE", lat:0.99139, lng:-79.65056,
      status:"TRANSITO", speed:9.1, destino:"Muellaje Sur"
    },
    {
      id:"ASD", name:"ASDMATER", lat:0.99028, lng:-79.64972,
      status:"MANTO", speed:0, destino:"Astillero"
    },
    {
      id:"ENX", name:"ENRIQUE XAVIER", lat:0.9678, lng:-79.6650,
      status:"MANIOBRA", speed:4.8, destino:"Boya 8B"
    },
  ];

  // Icons según estado
  function circle(color){
    return L.divIcon({
      html:`<div style="width:14px;height:14px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.15)"></div>`,
      className:"", iconSize:[14,14]
    });
  }
  const iconByStatus = {
    MANIOBRA: circle('#2e7d32'), // verde
    TRANSITO: circle('#fbc02d'),  // amarillo
    MANTO:    circle('#c62828')   // rojo
  };

  // ================== MAPA ==================
  const map = L.map('map',{zoomControl:true}).setView([0.99,-79.65], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const markers = new Map();
  function addOrMoveMarker(v){
    let m = markers.get(v.id);
    const popup = `
      <b>${v.name}</b><br>
      Estado: ${v.status}<br>
      Velocidad: ${v.speed} kn<br>
      Destino: ${v.destino}<br>
      Lat: ${v.lat.toFixed(5)} · Lng: ${v.lng.toFixed(5)}
    `;
    if(!m){
      m = L.marker([v.lat, v.lng], {icon: iconByStatus[v.status]}).addTo(map).bindPopup(popup);
      markers.set(v.id, m);
    }else{
      m.setLatLng([v.lat, v.lng]).setIcon(iconByStatus[v.status]).setPopupContent(popup);
    }
  }
  vessels.forEach(addOrMoveMarker);

  // ================== SIDEBAR (tarjetas) ==================
  const cardsWrap = document.getElementById('cards');
  function statusBadge(s){
    if(s==='MANIOBRA') return '<span class="badge b-green">En maniobra</span>';
    if(s==='TRANSITO') return '<span class="badge b-yellow">En tránsito</span>';
    return '<span class="badge b-red">Mantenimiento</span>';
  }
  function renderCards(list){
    cardsWrap.innerHTML = '';
    list.forEach(v=>{
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div>
          <div class="title">${v.name}</div>
          <div class="coords">Lat ${v.lat.toFixed(5)} · Long ${v.lng.toFixed(5)} · ${v.speed} kn</div>
        </div>
        <div class="right">
          ${statusBadge(v.status)}
          <button class="go-btn" data-id="${v.id}">Ir</button>
        </div>
      `;
      cardsWrap.appendChild(el);
    });
  }
  renderCards(vessels);

  // Botón "Ir" centra el mapa
  cardsWrap.addEventListener('click', e=>{
    if(e.target.classList.contains('go-btn')){
      const id = e.target.getAttribute('data-id');
      const v = vessels.find(x=>x.id===id);
      map.setView([v.lat, v.lng], 13, {animate:true});
      markers.get(id).openPopup();
    }
  });

  // ================== BÚSQUEDA Y FILTROS ==================
  const searchBox = document.getElementById('searchBox');
  const chips = [...document.querySelectorAll('.chip')];
  let currentFilter = 'ALL';

  function applyFilters(){
    const term = searchBox.value.trim().toUpperCase();
    const filtered = vessels.filter(v=>{
      const byText = v.name.toUpperCase().includes(term);
      const byState = currentFilter==='ALL' ? true : v.status===currentFilter;
      return byText && byState;
    });
    renderCards(filtered);
  }
  searchBox.addEventListener('input', applyFilters);
  chips.forEach(c=>c.addEventListener('click', ()=>{
    chips.forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    currentFilter = c.getAttribute('data-filter');
    applyFilters();
  }));

  // ================== RELOJ Y ACTUALIZACIÓN ==================
  const clock = document.getElementById('clock');
  const lastUpdate = document.getElementById('lastUpdate');
  function pad(n){return n.toString().padStart(2,'0')}
  function tick(){
    const d = new Date();
    clock.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  setInterval(tick, 1000); tick();

  function refresh(){
    // Demo: mueve un poco las posiciones de los que no están en Mantenimiento
    vessels.forEach(v=>{
      if(v.status!=='MANTO'){
        v.lat += (Math.random()-0.5)*0.002;
        v.lng += (Math.random()-0.5)*0.002;
        v.speed = Math.max(0, (v.speed + (Math.random()-0.5)*1.5)).toFixed(1)*1;
        addOrMoveMarker(v);
      }
    });
    renderCards(vessels.filter(v=>{
      // mantiene el filtro actual visible
      return currentFilter==='ALL' ? true : v.status===currentFilter;
    }));
    const d = new Date();
    lastUpdate.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  document.getElementById('refreshBtn').addEventListener('click', refresh);
  refresh(); // set initial "última actualización"
</script>
</body>
</html>
